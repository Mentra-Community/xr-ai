[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tea-demo"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["xr-ai-launcher", "tea-making-worker", "xr-rag-service", "xr-ai-models[riva]", "torch", "torchaudio"]

[project.scripts]
tea_demo = "main:run"

[tool.uv.sources]
xr-ai-launcher = {path = "../../utils/xr-ai-launcher", editable = true}
tea-making-worker = {path = "../../agent-samples/tea-making-sample/worker", editable = true}
xr-rag-service = {path = "../../services/rag-service", editable = true}
xr-ai-models = {path = "../../agent-sdk/xr-ai-models", editable = true}
torch = {index = "pytorch-cpu"}
torchaudio = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
